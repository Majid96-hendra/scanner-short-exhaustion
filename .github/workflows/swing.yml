name: Short Swing

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: short-swing
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang library
        run: pip install ccxt pandas requests

      - name: Scan short swing dan kirim ke Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCHANGE: bitget
          TIMEFRAME: 4h
          MODAL_USDT: "100"
          RISK_PCT: "2"
        run: python3 swing_short.py

      - name: Simpan state anti-spam
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add swing_state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase origin main && git push)
