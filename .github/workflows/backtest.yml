name: Backtest Swing

on:
  workflow_dispatch:        # jalankan manual dari tab Actions

permissions:
  contents: write           # agar params.json terbaik bisa disimpan otomatis

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python backtest.py all
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N: "60"
      - uses: actions/upload-artifact@v4
        with:
          name: hasil-backtest
          path: |
            hasil_backtest.txt
            params.json
      - name: Simpan parameter terbaik
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add params.json
          git diff --cached --quiet || (git commit -m "update params dari backtest" && git push)
