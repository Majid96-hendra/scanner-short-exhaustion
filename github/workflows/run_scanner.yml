name: Telegram Trigger Scanner

on:
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install ccxt yfinance pandas requests

      - name: Run Scanner Script
        run: |
          python scanner.py
